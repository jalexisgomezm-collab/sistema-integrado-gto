<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sistema Integrado GTO</title>
<link rel="icon" type="image/png" href="assets/icono-cot.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;800&display=swap" rel="stylesheet">
<style>
:root{--verde:#0A8A43;--verde2:#16A653;--texto:#1F2A24;--gris:#3C4540}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#fff;color:var(--texto)}
body{font-family:Nunito,"Segoe UI",Arial,sans-serif}
a{color:inherit;text-decoration:none}

/* ===== Lienzo con el diseño original (escritorio) ===== */
.lienzo{position:relative;width:100%;max-width:1672px;margin:0 auto;aspect-ratio:1672/941;background:url("assets/fondo-menu.jpg") center/100% 100% no-repeat;container-type:inline-size}
.lienzo .card{position:absolute;width:calc(506/1672*100%);height:calc(189/941*100%)}
.card{display:block;background:#fff;border-radius:1.05cqw;box-shadow:0 .25cqw .9cqw rgba(30,50,40,.13),0 0 0 .06cqw rgba(30,50,40,.06);overflow:hidden;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-.25cqw);box-shadow:0 .6cqw 1.6cqw rgba(10,138,67,.22),0 0 0 .1cqw rgba(10,138,67,.35)}
.card:focus-visible{outline:.2cqw solid var(--verde);outline-offset:.2cqw}
.card img{position:absolute;left:calc(14/506*100%);top:calc(16/189*100%);width:calc(100/506*100%);height:auto}
.card h3{position:absolute;left:calc(134/506*100%);right:4%;top:calc(30/189*100%);font-weight:800;font-size:1.52cqw;line-height:1.18;color:var(--texto)}
.card p{position:absolute;left:calc(22/506*100%);right:calc(90/506*100%);top:calc(124/189*100%);font-weight:600;font-size:1.04cqw;line-height:1.3;color:var(--gris)}
.card .ir{position:absolute;right:0;bottom:0;width:calc(70/506*100%);height:calc(42/189*100%);background:linear-gradient(135deg,var(--verde2),#06612E);clip-path:polygon(32% 0,100% 0,100% 100%,0 100%);display:flex;align-items:center;justify-content:flex-end;padding-right:1.05cqw}
.card .ir svg{width:1.35cqw;height:1.35cqw;color:#fff;display:block}

/* Posiciones (3 por fila, misma zona que las tarjetas originales) */
.lienzo .p1{left:calc(58/1672*100%);top:calc(407/941*100%)} .lienzo .p2{left:calc(584/1672*100%);top:calc(407/941*100%)} .lienzo .p3{left:calc(1110/1672*100%);top:calc(407/941*100%)}
.lienzo .p4{left:calc(58/1672*100%);top:calc(630/941*100%)} .lienzo .p5{left:calc(584/1672*100%);top:calc(630/941*100%)} .lienzo .p6{left:calc(1110/1672*100%);top:calc(630/941*100%)}

/* ===== Celular ===== */
.movil{display:none}
@media (max-width:760px){
  .lienzo{display:none}
  .movil{display:block}
  .movil .top{display:block;width:100%;height:auto}
  .movil .lista{display:grid;gap:14px;padding:18px 16px 22px}
  .movil .card{position:relative;height:138px;border-radius:14px;box-shadow:0 4px 14px rgba(30,50,40,.13)}
  .movil .card img{left:12px;top:12px;width:64px}
  .movil .card h3{left:90px;top:16px;right:12px;font-size:18px}
  .movil .card p{left:90px;top:auto;bottom:12px;right:64px;font-size:13px}
  .movil .card .ir{width:56px;height:36px}
  .movil .card .ir svg{width:18px;height:18px}
  .movil .card .ir{padding-right:12px}
  .movil .bottom{display:block;width:100%;height:auto}
}
</style>
</head>
<body>
<main>
  <div class="lienzo" id="lienzo" aria-label="Sistema Integrado GTO PERÚ — selecciona un sistema para ingresar"></div>
  <div class="movil"><img class="top" src="assets/cabecera-movil.jpg" alt="Sistema Integrado GTO PERÚ — Soluciones eléctricas y electrónicas para minería, industria y ferrovías"><div class="lista" id="lista"></div><img class="bottom" src="assets/pie-movil.jpg" alt=""></div>
</main>
<script>
/* Editar aquí los sistemas (nombre, descripción, icono y dirección) */
const SISTEMAS = [
  { nombre:'Sistema de<br>Cotizaciones', desc:'Emite cotizaciones con numeración automática y PDF con formato GTO.', icono:'assets/icono-cot.png', url:'https://cotizador-gto-web.vercel.app' },
  { nombre:'Maestro de Gestión<br>de Operaciones', desc:'Controla OT y proyectos internos: guías, informes, facturación y cobro.', icono:'assets/icono-maestro.png', url:'https://maestro-gestion-operaciones.vercel.app' },
  { nombre:'Logística y<br>Compras', desc:'Gestiona requerimientos, cotizaciones de proveedores y órdenes de compra.', icono:'assets/icono-compras.png', url:'https://gto-oc-sistema-app.vercel.app' },
  { nombre:'Bitácora Técnica<br>Laboratorio y Taller', desc:'Registra avances diarios por OT, historial por serie e ingreso de componentes.', icono:'assets/icono-taller.png', url:'https://bitacora-tecnica-gto.vercel.app' },
  { nombre:'RRHH y<br>Personal', desc:'Gestiona el personal, fichas, tareo, planillas y boletas.', icono:'assets/icono-rrhh.png', url:'https://gto-rrhh.vercel.app' },
  { nombre:'GTO<br>Finanzas', desc:'Administra el presupuesto, ingresos, egresos y factoring.', icono:'assets/icono-finanzas.png', url:'https://gto-finanzas.vercel.app' },
];
const flecha='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>';
const tarjeta=(s,i)=>`<a class="card p${i+1}" href="${s.url}" target="_blank" rel="noopener" aria-label="${s.nombre.replace('<br>',' ')}">
  <img src="${s.icono}" alt=""><h3>${s.nombre}</h3><p>${s.desc}</p><span class="ir">${flecha}</span></a>`;
document.getElementById('lienzo').innerHTML=SISTEMAS.map(tarjeta).join('');
document.getElementById('lista').innerHTML=SISTEMAS.map(tarjeta).join('');
</script>
</body>
</html>
